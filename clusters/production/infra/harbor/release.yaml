apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  chart:
    spec:
      chart: harbor
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  interval: 24h
  values:
    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: as216455.net
            namespace: gateway
        hosts:
          - "images.as216455.net"
    externalURL: https://images.as216455.net

    persistence:
      enabled: true
      resourcePolicy: "keep"
      persistentVolumeClaim:
        registry:
          storageClass: "ceph-rbd-pve"
          size: 10Gi
        jobservice:
          jobLog:
            accessMode: ReadWriteOnce
            size: 1Gi
      imageChartStorage:
        disableredirect: false
        type: filesystem
        filesystem:
          rootdirectory: /storage
    existingSecretAdminPassword: harbor-keys
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    existingSecretSecretKey: "harbor-keys"

    registry:
      credentials:
        existingSecret: "harbor-registry"

    database:
      type: external
      external:
        host: "harbor-rw.cnpg-system"
        port: "5432"
        username: "app"
        coreDatabase: "app"
        # if using existing secret, the key must be "password"
        existingSecret: "db-harbor"
