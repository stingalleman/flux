apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cert-manager
      version: v1.20.4
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  interval: 24h
  values:
    config:
      gatewayAPI:
        enabled: true
        enableListenerSet: true
      featureGates:
        ListenerSets: true

    crds:
      enabled: true

    replicaCount: 2

    podDnsPolicy: "None"
    podDnsConfig:
      nameservers:
        - "9.9.9.9"

    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        namespace: monitoring
        interval: 60s
        labels:
          release: monitoring-stack
