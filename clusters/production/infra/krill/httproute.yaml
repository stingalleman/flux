apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: krill
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: i.as216455.net
      namespace: gateway
  hostnames:
    - "krill.i.as216455.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: krill-http
          port: 3000
