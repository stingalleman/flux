apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whatsapp-bridge
  namespace: matrix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: matrix.maishond.nl
      namespace: gateway
  hostnames:
    - "whatsapp.bridge.matrix.maishond.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bridge-whatsapp
          port: 29318
