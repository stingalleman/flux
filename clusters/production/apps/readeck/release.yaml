apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: readeck
  namespace: default
spec:
  chart:
    spec:
      chart: readeck
      sourceRef:
        kind: HelmRepository
        name: zekker6
        namespace: flux-system
      version: "0.32.0"
  interval: 24h
  values:
    persistence:
      data:
        enabled: true
        mountPath: /readeck
        accessMode: ReadWriteOnce
        size: 100Mi
        emptyDir:
          enabled: false
    env:
      TZ: Europe/Amsterdam
