apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: ldap
  namespace: authentik
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      kind: Gateway
      sectionName: ldap
  rules:
    - backendRefs:
        - kind: Service
          name: ak-outpost-ldap-outpost
          port: 389
---
