# yaml-language-server: $schema=file:///Users/sting/.local/share/nvim/yaml-companion.nvim/crd-cache/admin_kluster.boem/listenersets.gateway.networking.k8s.io.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: stingalleman.nl
  namespace: envoy-gateway-system
spec:
  parentRef:
    name: external
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "stingalleman.nl"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "stingalleman.nl"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            name: stingalleman.nl-prod-tls
            namespace: traefik
            kind: Secret
