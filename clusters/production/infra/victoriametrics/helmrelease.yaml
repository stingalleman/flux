apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # cannot be "victoria-metrics-k8s-stack" because of job.batch
  # "victoria-metrics-k8s-stack-victoria-metrics-operator-cleanup-hook" is invalid:
  # spec.template.labels: Invalid value: "victoria-metrics-k8s-stack-victoria-metrics-operator-cleanup-hook":
  # must be no more than 63 bytes
  name: vm-stack
  namespace: victoriametrics
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      version: 0.96.1
  interval: 30s
  values:
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          storageClassName: ceph-rbd-pve-unreplicated
          resources:
            requests:
              storage: 50Gi
      route:
        enabled: true
        hostnames:
          - vmsingle.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    # local metrics collector
    vmagent:
      enabled: true
      route:
        enabled: true
        hostnames:
          - vmagent.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    vmalert:
      enabled: true
      route:
        enabled: true
        hostnames:
          - vmalert.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          storageClassName: ceph-rbd-pve-unreplicated
          resources:
            requests:
              storage: 50Gi
      route:
        enabled: true
        hostnames:
          - vlsingle.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    # logs collector
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true
      route:
        enabled: true
        hostnames:
          - vlagent.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    vtsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          storageClassName: ceph-rbd-pve-unreplicated
          resources:
            requests:
              storage: 50Gi
      route:
        enabled: true
        hostnames:
          - vtsingle.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    victoria-metrics-operator:
      env:
        - name: VM_ENABLESTRICTSECURITY
          value: "true"

    grafana:
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      persistence:
        enabled: true
        storageClassName: ceph-rbd-pve-unreplicated
        size: 5Gi
      route:
        main:
          enabled: true
          kind: HTTPRoute
          hostnames:
            - grafana.monitoring.i.as216455.net
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: monitoring.i.as216455.net
              namespace: gateway

    alertmanager:
      route:
        enabled: true
        hostnames:
          - alertmanager.monitoring.i.as216455.net
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: monitoring.i.as216455.net
            namespace: gateway

    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
