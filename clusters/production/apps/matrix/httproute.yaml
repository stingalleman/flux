---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-admin
  namespace: matrix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: matrix.maishond.nl
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - "admin.matrix.maishond.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-stack-element-admin
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-element-web
