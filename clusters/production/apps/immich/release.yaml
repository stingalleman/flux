apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 24h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.0.3
            resources:
              requests:
                memory: 512Mi
                cpu: 1000m
              limits:
                memory: 2Gi
                cpu: 2500m
            env:
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: username
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

      # configuration is immich-config.json converted to yaml. Ignored if existingConfiguration is set.
      # ref: https://immich.app/docs/install/config-file/
      #
      configuration: {}
        # trash:
        #   enabled: false
        #   days: 30
        # storageTemplate:
        #   enabled: true
        #   template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
      # Sets the resource Kind to store configuration in. Must be either ConfigMap or Secret.
      configurationKind: ConfigMap

    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClass: ceph-rbd-pve

    server:
      enabled: true
      controllers:
        main:
          resources:
            requests:
              memory: 512Mi
              cpu: 1000m
            limits:
              memory: 2Gi
              cpu: 2500m

    machine-learning:
      enabled: false
      # persistence:
      #   cache:
      #     enabled: true
      #     type: persistentVolumeClaim
      #     size: 10Gi
      #     accessMode: ReadWriteMany
      #     storageClass: ceph-rbd-pve
