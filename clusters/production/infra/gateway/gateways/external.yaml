# yaml-language-server: $schema=file:///Users/sting/.local/share/nvim/yaml-companion.nvim/crd-cache/admin_kluster.boem/gateways.gateway.networking.k8s.io.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    labels:
      lb-pool: external
    annotations:
      lbipam.cilium.io/ips: "2.27.100.103,2a07:54c7:5201:6e6f::d"
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
