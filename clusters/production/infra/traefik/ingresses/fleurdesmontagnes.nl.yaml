apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fleurdesmontagnes.nl
  namespace: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`home.fleurdesmontagnes.nl`)
      services:
        - kind: Service
          name: bloembergen
          namespace: traefik
          port: 80

  tls:
    secretName: fleurdesmontagnes.nl-prod-tls
