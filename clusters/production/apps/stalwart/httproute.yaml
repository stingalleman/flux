apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-discovery
  namespace: stalwart
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: as216455.net
      namespace: gateway
  hostnames:
    - "autodiscover.as216455.net"
    - "autoconfig.as216455.net"
    - "mta-sts.as216455.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stalwart
          port: 8080
          kind: Service
