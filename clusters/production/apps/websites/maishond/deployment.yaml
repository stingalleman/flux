apiVersion: apps/v1
kind: Deployment
metadata:
  name: maishond-site
  namespace: websites
  labels:
    app: maishond-site
spec:
  selector:
    matchLabels:
      app: maishond-site
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: maishond-site
    spec:
      containers:
        - name: maishond-site
          image: ghcr.io/maishond/maishond.nl@sha256:fd7a6a74bb18831963c5f97cb27f4deb2f9999d0cf71cc6c3bae6e5b2d85d2dc
          ports:
            - containerPort: 8080
              name: http
      restartPolicy: Always
