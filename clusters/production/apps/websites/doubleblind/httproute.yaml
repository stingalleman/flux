apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doubleblind-site
  namespace: default
spec:
  parentRefs:
    - name: doubleblind.nl
      namespace: gateway
      kind: ListenerSet
      group: gateway.networking.k8s.io
  hostnames:
    - doubleblind.nl
    - www.doubleblind.nl
  rules:
    - backendRefs:
        - name: doublblind-site
          port: 80
