# yaml-language-server: $schema=file:///Users/sting/.local/share/nvim/yaml-companion.nvim/crd-cache/admin_kluster.boem/tcproutes.gateway.networking.k8s.io.json
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: pop3s
  namespace: stalwart
spec:
  parentRefs:
    - name: mail
      namespace: gateway
      kind: Gateway
      sectionName: pop3s
  rules:
    - backendRefs:
        - kind: Service
          name: stalwart
          port: 995
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: imaps
  namespace: stalwart
spec:
  parentRefs:
    - name: mail
      namespace: gateway
      kind: Gateway
      sectionName: imaps
  rules:
    - backendRefs:
        - kind: Service
          name: stalwart
          port: 993
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: smtp
  namespace: stalwart
spec:
  parentRefs:
    - name: mail
      namespace: gateway
      kind: Gateway
      sectionName: smtp
  rules:
    - backendRefs:
        - kind: Service
          name: stalwart
          port: 25
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: smtps
  namespace: stalwart
spec:
  parentRefs:
    - name: mail
      namespace: gateway
      kind: Gateway
      sectionName: smtps
  rules:
    - backendRefs:
        - kind: Service
          name: stalwart
          port: 465
---
# set PROXY protocol
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: stalwart-proxy
  namespace: stalwart
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: pop3s
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: imaps
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: smtps
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: smtp
  proxyProtocol:
    version: V2
