apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: default
spec:
  releaseName: netbox
  interval: 24h
  chart:
    spec:
      chart: netbox
      version: 8.3.81
      sourceRef:
        kind: HelmRepository
        name: netbox
        namespace: flux-system
  values:
    superuser:
      existingSecret: "netbox-superuser"

    externalDatabase:
      host: netbox-rw.cnpg-system
      port: 5432
      database: app
      username: app
      existingSecretName: netbox-database
      existingSecretKey: password

    valkey:
      enabled: true
      sentinel:
        enabled: false
        primarySet: netbox-kv
      auth:
        # Sentinel auth is disabled by default, as Netbox does not support configuring SENTINEL_KWARGS.
        sentinel: false

    worker:
      enabled: true
      ## NOTE: ReadWriteMany PVC(s) are required if replicaCount > 1
      replicaCount: 1

    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io/v1
          kind: ListenerSet
          name: i.as216455.net
          namespace: gateway
      hostnames:
        - netbox.i.as216455.net
