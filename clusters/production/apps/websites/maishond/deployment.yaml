apiVersion: apps/v1
kind: Deployment
metadata:
  name: maishond-site
  namespace: websites
  labels:
    app: maishond-site
spec:
  selector:
    matchLabels:
      app: maishond-site
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: maishond-site
    spec:
      containers:
        - name: maishond-site
          image: ghcr.io/maishond/maishond.nl@sha256:c7a87dc5e5aa1237af9adbc6d24fe3568568a3fb04f2a055d0206a64976a80bb
          ports:
            - containerPort: 8080
              name: http
      restartPolicy: Always
