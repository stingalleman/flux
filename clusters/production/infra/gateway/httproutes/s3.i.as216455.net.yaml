apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3-i-as216455
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: s3.i.as216455.net
      namespace: gateway
  hostnames:
    - "s3.i.as216455.net"
    - "*.s3.i.as216455.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: ceph-rgw-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ceph-rgw-backend
  namespace: gateway
spec:
  endpoints:
    - ip:
        port: 7480
        address: "10.176.70.1"
