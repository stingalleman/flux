apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  chart:
    spec:
      chart: falco
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
      # version: "1.10.2"
  interval: 24h
  values:
    tty: true
    falcosidekick:
      enabled: true
      webui:
        enabled: true
