apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mail
  namespace: gateway
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    labels:
      lb-pool: external
    annotations:
      lbipam.cilium.io/ips: "2.27.100.101,2a07:54c7:5201:6e6f::b"
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: pop3s
      protocol: TCP
      port: 995
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
    - name: imaps
      protocol: TCP
      port: 993
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
    - name: smtp
      protocol: TCP
      port: 25
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
    - name: smtps
      protocol: TCP
      port: 465
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: stalwart
