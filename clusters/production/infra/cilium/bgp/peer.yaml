apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-peer0
spec:
  nodeSelector:
    matchLabels:
      bgp_enabled: "true"
  bgpInstances:
    - name: asn-65500
      localASN: 65500
      peers:
        - name: rtr01
          peerAddress: "2a07:54c7:5201:7377::1"
          peerASN: 216455
          peerConfigRef:
            name: bgp-peer0
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer0
spec:
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp-peer0
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp-peer0
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-peer0
  labels:
    advertise: bgp-peer0
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: somekey
            operator: NotIn
            values:
              - never-used-value
