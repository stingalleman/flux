apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix
  namespace: cnpg-system
spec:
  # imageName:
  instances: 2
  # Example of rolling update strategy:
  # - unsupervised: automated update of the primary once all
  #                 replicas have been upgraded (default)
  # - supervised: requires manual supervision to perform
  #               the switchover of the primary
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true

  resources:
    requests:
      memory: "3Gi"
      cpu: "2000m"
    limits:
      memory: "6Gi"
      cpu: "4000m"
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 1GB
      effective_cache_size: 8GB
      work_mem: 64MB
      maintenance_work_mem: 512MB

  managed:
    roles:
      - name: synapse
        ensure: present
        login: true
        createdb: true
        replication: false
        connectionLimit: -1
        passwordSecret:
          name: matrix-synapse-user

  bootstrap:
    initdb:
      database: synapse
      owner: synapse_user
      encoding: "UTF8"
      locale: "C"

  # Require 1Gi of space
  storage:
    size: 300Gi
    storageClass: ceph-rbd-pve

  # plugins:
  #   - name: barman-cloud.cloudnative-pg.io
  #     isWALArchiver: true
  #     parameters:
  #       barmanObjectName: synapse-store
