# yaml-language-server: $schema=file:///Users/sting/.local/share/nvim/yaml-companion.nvim/crd-cache/admin_production.clusters.i.as216455.net/helmreleases.helm.toolkit.fluxcd.io.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  interval: 24h
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  chart:
    spec:
      chart: ceph-csi-drivers
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: rook-ceph
      version: 1.1.0

  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap

        nodePlugin:
          priorityClassName: system-node-critical

        controllerPlugin:
          priorityClassName: system-cluster-critical
          hostNetwork: true

    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: none #volumeSnapshot

      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: none #volumeSnapshot

      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com

      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
