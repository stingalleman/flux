---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-rtc
  namespace: matrix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: maishond.nl
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - "mrtc-matrix.maishond.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sfu/get
        - path:
            type: PathPrefix
            value: /get_token
        - path:
            type: PathPrefix
            value: /delegate_delayed_leave
      backendRefs:
        - name: matrix-stack-matrix-rtc-authorisation-service
