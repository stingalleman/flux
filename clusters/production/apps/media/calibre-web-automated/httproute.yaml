apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: books
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: stingalleman.nl
      namespace: gateway
  hostnames:
    - "books.stingalleman.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: calibre-web-automated
          port: 80
