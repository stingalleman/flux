apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cynisch
  namespace: matrix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: maishond.nl
      namespace: gateway
  hostnames:
    - "chat.maishond.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cynisch
          port: 80
