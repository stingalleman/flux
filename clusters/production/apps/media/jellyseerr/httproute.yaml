apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseerr
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: maishond.nl
      namespace: gateway
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: stingalleman.nl
      namespace: gateway
  hostnames:
    - "request.maishond.nl"
    - "request.stingalleman.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyseerr
          port: 5055
